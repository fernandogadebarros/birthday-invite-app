name: Database backup

on:
  schedule:
    - cron: "0 7 * * *" # every day at 07:00 UTC (04:00 in Brazil)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Dump and encrypt the public schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges --file=backup.sql
          test -s backup.sql

      # The repository is public and so are its artifacts, and the dump holds guest names
      # and phone numbers: it is only stored encrypted.
      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" --output "backup-$(date -u +%F).sql.gpg" backup.sql
          rm backup.sql

      - name: Upload the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backup-*.sql.gpg
          retention-days: 30
          if-no-files-found: error
